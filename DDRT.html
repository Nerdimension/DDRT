<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DDRT v0.0.8.a (v26.11.06.11.22)</title>
  <style>

    :root{
      color-scheme:dark;
      --bg:#111111; --panel:#141414; --panel-2:#191919; --text:#e8e8e8; --muted:#a4a4a4;
      --line:#666666; --line-soft:#383838; --accent:#dedede; --danger:#f87171;
      --shadow:none; --radius:22px; --bubble:#202020; --bubble-2:#242424;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{color:inherit}
    .app{height:100dvh;display:grid;grid-template-columns:148px minmax(0,1fr);gap:8px;padding:12px 18px}
    .sidebar,.main{background:var(--panel);border:2px solid var(--line);border-radius:25px;overflow:hidden;min-height:0}
    .sidebar{display:flex;flex-direction:column;gap:8px;padding:7px}
    .brand{min-height:53px;padding:7px 9px;border:2px solid var(--line);border-radius:15px;display:flex;align-items:center;justify-content:space-between;gap:6px}
    .brand h1{margin:0;font-size:1.35rem;letter-spacing:.02em;font-weight:800}
    .brand p{display:none}
    .brand .icon-btn{font-size:1.2rem;border:0;background:transparent}
    .sidebar-actions{display:none}
    .profile-panel,.list-panel{border:2px solid var(--line);border-radius:19px;padding:7px;min-height:0;display:flex;flex-direction:column}
    .profile-panel{flex:0 0 auto;max-height:34%}
    .list-panel{flex:1}
    .section-head{display:flex;align-items:center;gap:5px;margin-bottom:5px}
    .section-head select{width:100%;min-width:0;background:#1b1b1b;color:var(--text);border:1.5px solid var(--line);border-radius:9px;padding:4px 6px;outline:none}
    .section-head .icon-btn{width:26px;height:26px;border-radius:8px}
    .profile-list,.list-wrap{padding:0;overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#777 transparent}
    .profile-list{display:grid;gap:2px}
    .list-wrap{flex:1}
    .profile-item,.list-item{width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:5px 4px;border-radius:9px;display:flex;align-items:center;gap:6px;cursor:pointer;margin:0;min-width:0}
    .profile-item:hover,.list-item:hover{background:#202020}
    .profile-item.active,.list-item.active{background:#292929;border-color:#777}
    .select-dot{width:17px;height:17px;border:2px solid #bdbdbd;border-radius:50%;display:inline-grid;place-items:center;flex:0 0 auto}
    .active .select-dot:after{content:"";width:8px;height:8px;border-radius:50%;background:#e6e6e6}
    .nav-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;font-size:.88rem}
    .pin-btn{border:0;background:transparent;padding:1px 2px;color:#858585;cursor:pointer;font-size:.8rem;line-height:1;flex:0 0 auto}
    .pin-btn.pinned{color:#ff8278}
    .list-item{padding:5px 4px}
    .list-item .title{display:contents}
    .list-item .meta{display:none}
    .list-item .count{font-size:.7rem;color:var(--muted)}
    .main{display:flex;flex-direction:column;min-width:0}
    .topbar{padding:8px 12px;border-bottom:2px solid var(--line);display:grid;grid-template-columns:minmax(120px,1fr) minmax(180px,1.3fr) auto;align-items:center;gap:10px;min-height:58px}
    .topbar .title{font-size:1.55rem;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .list-description{grid-column:1/3;grid-row:2;min-height:0;max-height:160px;resize:vertical;width:100%;background:transparent;color:var(--muted);border:0;outline:none;text-align:center;font-size:.78rem;line-height:1.3;padding:0 12px}
    .list-description:empty{display:none}
    .list-description:not(:placeholder-shown){display:block}
    .topbar .search{grid-column:2;grid-row:1;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#1b1b1b;color:var(--text);outline:none;min-width:0;width:100%}
    .topbar .primary-btn{grid-column:3;grid-row:1;white-space:nowrap}
    .topbar .title:has(+ .search){grid-column:1;grid-row:1}
    .topbar .icon-btn{display:none}
    .content{padding:12px;overflow:auto;min-height:0;flex:1}
    .empty{height:100%;min-height:180px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}
    .empty .box{max-width:420px;background:#181818;border:1px dashed var(--line);border-radius:18px;padding:22px}
    .entry{background:#171717;border:1.5px solid var(--line);border-radius:17px;margin-bottom:11px;overflow:hidden}
    .entry-head{padding:11px 12px 9px;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line-soft);background:#191919;display:flex}
    .entry-main{flex:1;min-width:0}
    .entry-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0;font-size:1rem;font-weight:800}
    .entry-summary{margin:6px 0 0;color:#c7c7c7;white-space:pre-wrap;line-height:1.45}
    .meta-bar,.sub-meta{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:999px;background:#202020;border:1px solid var(--line-soft);color:var(--muted);font-size:.72rem;flex-wrap:wrap}
    .entry-actions,.sub-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .entry-body{padding:9px}
    .sub-list{display:grid;gap:8px;padding:2px}
    .sub-item{border:1px solid var(--line-soft);border-radius:13px;overflow:hidden;background:#151515}
    .sub-item.pinned{border-color:#a66b67}
    .sub-head{padding:7px 9px;background:#191919;border-bottom:1px solid var(--line-soft);justify-content:space-between;align-items:flex-start;display:flex;gap:8px}
    .sub-meta{margin:0}
    .sub-bubble{margin:9px;padding:10px 12px;background:var(--bubble);border-radius:12px;white-space:pre-wrap;line-height:1.5;border:1px solid var(--line-soft);overflow-wrap:anywhere}
    .sub-item.pinned .sub-bubble{background:var(--bubble-2);border-color:#5d514f}
    .thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,100px));gap:8px;padding:0 10px 10px}
    .thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#202020;position:relative;cursor:pointer}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .thumb .x{position:absolute;top:5px;right:5px;width:23px;height:23px;border-radius:50%;border:0;background:rgba(0,0,0,.78);color:#fff;cursor:pointer}
    .muted,.small{color:var(--muted)}
    .icon-btn,.primary-btn,.ghost-btn{border:1px solid var(--line);border-radius:10px;padding:0;cursor:pointer;transition:background .12s ease,transform .12s ease;user-select:none;background:#1c1c1c;color:var(--text)}
    .icon-btn:active,.primary-btn:active,.ghost-btn:active{transform:scale(.98)}
    .icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;font-size:1rem;flex:0 0 auto}
    .primary-btn,.ghost-btn{padding:7px 11px;font-weight:600}
    .primary-btn{background:#e3e3e3;color:#151515;border-color:#e3e3e3}
    .ghost-btn.danger{color:#ff9b9b;border-color:#764747}
    .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;padding:14px;z-index:40}
    .modal-backdrop.show{display:grid}
    .modal{width:min(680px,100%);max-height:min(92vh,900px);overflow:auto;background:#191919;color:var(--text);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.5);border:1px solid var(--line)}
    .modal-head{padding:12px 14px;border-bottom:1px solid var(--line-soft);justify-content:space-between;display:flex;align-items:center}
    .modal-head h2{margin:0;font-size:1.05rem}
    .modal-body{padding:14px;display:grid;gap:14px}
    .field{display:grid;gap:6px}
    .field label{font-weight:700;font-size:.84rem}
    .field input[type="text"],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;background:#111;color:var(--text)}
    .field textarea{min-height:90px;resize:vertical}
    .field input:focus,.field textarea:focus{border-color:#aaa}
    .images-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
    .preview{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#202020;aspect-ratio:1}
    .preview img{width:100%;height:100%;object-fit:cover;display:block}
    .preview button{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.8);color:#fff;cursor:pointer}
    .modal-foot{padding:10px 14px 12px;border-top:1px solid var(--line-soft);justify-content:space-between;flex-wrap:wrap;display:flex;align-items:center}
    .toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(235,235,235,.96);color:#111;padding:10px 14px;border-radius:999px;z-index:60;display:none;max-width:calc(100vw - 24px);text-align:center}
    .toast.show{display:block}
    .viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:70;padding:12px}
    .viewer.show{display:grid}
    .viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
    .viewer .close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;color:#fff;background:rgba(255,255,255,.12);font-size:1.2rem;cursor:pointer}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:700px){
      .app{height:100dvh;grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:7px;gap:7px}
      .sidebar{order:1;max-height:39dvh;position:relative;z-index:5;display:grid;grid-template-columns:110px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:6px}
      .brand{grid-column:1;grid-row:1;min-height:44px;padding:5px;flex-direction:column;justify-content:center}
      .brand h1{font-size:1.05rem}
      .brand .icon-btn{width:25px;height:22px}
      .profile-panel{grid-column:2;grid-row:1;max-height:none;min-height:44px;padding:4px}
      .profile-panel .profile-list{display:flex;flex-wrap:wrap;overflow:auto}
      .profile-item{width:auto;flex:0 0 auto;padding:3px 5px}
      .profile-item .pin-btn{display:none}
      .list-panel{grid-column:1/3;grid-row:2;padding:5px;min-height:0}
      .list-panel .section-head{margin-bottom:2px}
      .list-wrap{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden}
      .list-item{width:auto;flex:0 0 auto;min-width:82px;justify-content:flex-start;padding:5px 8px}
      .list-item .count{display:none}
      .main{order:2;min-height:0}
      .topbar{grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:8px;min-height:0}
      .topbar .title{grid-column:1;grid-row:1;font-size:1.2rem}
      .topbar .search{grid-column:1;grid-row:2;max-width:none;width:100%}
      .topbar .primary-btn{grid-column:2;grid-row:1/3}
      .list-description{grid-column:1/3;grid-row:3;text-align:left;padding:3px 2px}
      .content{padding:8px}
      .entry-head{gap:7px}
      .entry-actions,.sub-actions{gap:4px}
      .icon-btn{width:29px;height:29px}
    }

  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>DDRT</h1>
      <button class="icon-btn" id="btnSettings" title="Settings" aria-label="Settings">⚙</button>
    </div>
    <section class="profile-panel">
      <div class="section-head">
        <select id="profileSelect" aria-label="Profiles"></select>
        <button class="icon-btn" id="btnAddProfile" title="Add profile" aria-label="Add profile">＋</button>
      </div>
      <div class="profile-list" id="profileList"></div>
    </section>
    <section class="list-panel">
      <div class="section-head">
        <span class="nav-name">Lists</span>
        <button class="icon-btn" id="btnAddList" title="Add list" aria-label="Add list">＋</button>
      </div>
      <div class="list-wrap" id="listWrap"></div>
    </section>
    <div class="sidebar-actions">
      <button class="ghost-btn" id="btnExportAll">Export all</button>
      <button class="ghost-btn" id="btnExportList">Export list</button>
      <button class="ghost-btn" id="btnImport">Import</button>
      <input class="sr-only" type="file" id="importFile" accept="application/json" />
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="title" id="currentListTitle">No list selected</div>
      <input class="search" id="searchBox" type="text" placeholder="Search entries and sub entries" />
      <button class="primary-btn" id="btnAddEntry" title="Add entry">＋ Add new entry</button>
      <textarea class="list-description" id="listDescription" placeholder="List description..." aria-label="List description"></textarea>
      <button class="icon-btn" id="btnEditList" title="Edit current list" aria-label="Edit current list">✎</button>
      <button class="icon-btn" id="btnDeleteList" title="Delete current list" aria-label="Delete current list">🗑</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">Modal</h2>
      <button class="icon-btn" id="modalClose" aria-label="Close">✕</button>
    </div>
    <form id="modalForm">
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot">
        <div class="small" id="modalHint"></div>
        <div class="entry-actions">
          <button class="ghost-btn" type="button" id="modalCancel">Cancel</button>
          <button class="primary-btn" type="submit" id="modalSave">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="viewer" id="viewer" aria-hidden="true">
  <button class="close" id="viewerClose" aria-label="Close image">✕</button>
  <img id="viewerImg" alt="Preview" />
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'offline_threads_tasks_state_v3';

const state = { lists: [], profiles: [], selectedProfileId: null, selectedListId: null, search: '' };
const els = {
  listWrap: document.getElementById('listWrap'),
  profileList: document.getElementById('profileList'),
  profileSelect: document.getElementById('profileSelect'),
  btnAddProfile: document.getElementById('btnAddProfile'),
  btnSettings: document.getElementById('btnSettings'),
  listDescription: document.getElementById('listDescription'),
  content: document.getElementById('content'),
  currentListTitle: document.getElementById('currentListTitle'),
  searchBox: document.getElementById('searchBox'),
  btnAddList: document.getElementById('btnAddList'),
  btnAddEntry: document.getElementById('btnAddEntry'),
  btnEditList: document.getElementById('btnEditList'),
  btnDeleteList: document.getElementById('btnDeleteList'),
  btnExportAll: document.getElementById('btnExportAll'),
  btnExportList: document.getElementById('btnExportList'),
  btnImport: document.getElementById('btnImport'),
  importFile: document.getElementById('importFile'),
  modalBackdrop: document.getElementById('modalBackdrop'),
  modalTitle: document.getElementById('modalTitle'),
  modalBody: document.getElementById('modalBody'),
  modalHint: document.getElementById('modalHint'),
  modalClose: document.getElementById('modalClose'),
  modalCancel: document.getElementById('modalCancel'),
  modalForm: document.getElementById('modalForm'),
  viewer: document.getElementById('viewer'),
  viewerImg: document.getElementById('viewerImg'),
  viewerClose: document.getElementById('viewerClose'),
  toast: document.getElementById('toast'),
};
let modalContext = null;

function uuid(){ return (crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
function nowISO(){ return new Date().toISOString(); }
function pad2(n){ return String(n).padStart(2,'0'); }
function formatDateTime(iso){
  const d = new Date(iso);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getFullYear()}-${months[d.getMonth()]}-${pad2(d.getDate())} : ${pad2(d.getHours())}-${pad2(d.getMinutes())}-${pad2(d.getSeconds())}`;
}
function escapeHtml(str){
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#39;');
}
function deepCopy(obj){ return JSON.parse(JSON.stringify(obj)); }
function showToast(msg){
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 1500);
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  }catch{return null;}
}
function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
function touch(obj){ obj.updatedAt = nowISO(); }
function selectedList(){ return state.lists.find(l => l.id === state.selectedListId) || null; }
function selectedProfile(){ return state.profiles.find(p => p.id === state.selectedProfileId) || null; }
function profileLists(profile=selectedProfile()){
  const ids = new Set(profile?.listIds || []);
  return state.lists.filter(l => ids.has(l.id));
}
function ensureSelection(){
  if (!state.profiles.length){
    const profile = { id:uuid(), name:'Personal', pinned:true, listIds:state.lists.map(l=>l.id), createdAt:nowISO(), updatedAt:nowISO() };
    state.profiles = [profile];
  }
  state.profiles.forEach(p => { if (!Array.isArray(p.listIds)) p.listIds = []; });
  const assigned = new Set(state.profiles.flatMap(p => p.listIds));
  state.lists.forEach(l => {
    if (!assigned.has(l.id)){
      const target = state.profiles[0];
      target.listIds.push(l.id);
      assigned.add(l.id);
    }
  });
  state.profiles.forEach(p => p.listIds = p.listIds.filter(id => state.lists.some(l=>l.id===id)));
  if (!state.selectedProfileId || !state.profiles.some(p=>p.id===state.selectedProfileId))
    state.selectedProfileId = state.profiles[0]?.id || null;
  const visible = profileLists();
  if (!visible.some(l=>l.id===state.selectedListId))
    state.selectedListId = visible[0]?.id || null;
}
function sortedProfiles(){ return [...state.profiles].sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned) || new Date(a.createdAt)-new Date(b.createdAt)); }
function sortedLists(){ return [...profileLists()].sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned) || new Date(b.updatedAt)-new Date(a.updatedAt)); }
function sortedEntries(list){
  const q = state.search.trim().toLowerCase();
  let arr = [...(list?.entries || [])].sort((a,b)=> new Date(b.updatedAt) - new Date(a.updatedAt));
  if (!q) return arr;
  return arr.filter(entry => {
    const hay = [entry.title, entry.summary, ...(entry.subEntries||[]).map(s => s.text)].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function sortedSubEntries(entry){
  return [...(entry?.subEntries || [])].sort((a,b)=>{
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });
}
function render(){
  ensureSelection();
  renderProfiles();
  renderLists();
  renderCurrent();
  saveState();
}
function renderProfiles(){
  const profiles = sortedProfiles();
  els.profileSelect.innerHTML = profiles.map(p=>`<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)}</option>`).join('');
  els.profileSelect.value = state.selectedProfileId || '';
  els.profileList.innerHTML = profiles.map(profile=>`
    <div class="profile-item ${profile.id===state.selectedProfileId?'active':''}" data-profile-id="${escapeHtml(profile.id)}">
      <span class="select-dot"></span>
      <span class="nav-name">${escapeHtml(profile.name)}</span>
      <button class="pin-btn" data-profile-edit="${escapeHtml(profile.id)}" title="Edit profile">✎</button>
      <button class="pin-btn ${profile.pinned?'pinned':''}" data-profile-pin="${escapeHtml(profile.id)}" title="${profile.pinned?'Unpin':'Pin'} profile">📌</button>
    </div>
  `).join('');
  els.profileList.querySelectorAll('.profile-item').forEach(item=>item.addEventListener('click',e=>{
    if(e.target.closest('[data-profile-pin]')) return;
    state.selectedProfileId=item.dataset.profileId;
    state.selectedListId=profileLists(selectedProfile())[0]?.id||null;
    render();
  }));
  els.profileList.querySelectorAll('[data-profile-edit]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    const p=state.profiles.find(x=>x.id===btn.dataset.profileEdit); if(p)openProfileModal(p);
  }));
  els.profileList.querySelectorAll('[data-profile-pin]').forEach(btn=>btn.addEventListener('click',e=>{
    e.stopPropagation();
    const p=state.profiles.find(x=>x.id===btn.dataset.profilePin); if(!p)return;
    p.pinned=!p.pinned; touch(p); render();
  }));
}
function renderLists(){
  const lists = sortedLists();
  if (!lists.length){
    els.listWrap.innerHTML = `<div class="empty" style="height:auto;min-height:90px;padding:8px;"><div class="muted">No lists in this profile yet.</div></div>`;
    return;
  }
  els.listWrap.innerHTML = lists.map(list => `
    <div class="list-item ${list.id === state.selectedListId ? 'active' : ''}" data-id="${escapeHtml(list.id)}">
      <span class="select-dot"></span>
      <span class="nav-name">${escapeHtml(list.name)}</span>
      <span class="count">${(list.entries||[]).length}</span>
      <button class="pin-btn ${list.pinned?'pinned':''}" data-list-pin="${escapeHtml(list.id)}" title="${list.pinned?'Unpin':'Pin'} list">📌</button>
    </div>
  `).join('');
  els.listWrap.querySelectorAll('.list-item').forEach(item => item.addEventListener('click',e=>{
    if(e.target.closest('[data-list-pin]')) return;
    state.selectedListId=item.dataset.id;
    render();
  }));

async function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}
async function setupImagePreview(existingSub=null){
  const grid = document.getElementById('imagePreviewGrid');
  const fileInput = document.getElementById('subImages');
  const existing = existingSub ? [...(existingSub.images || [])] : [];
  let newImages = [];

  function draw(){
    const items = [...existing.map(img => ({...img})), ...newImages];
    if (!items.length){
      grid.innerHTML = '<div class="muted" style="grid-column:1/-1;">No images selected yet.</div>';
      return;
    }
    grid.innerHTML = items.map((img, idx) => `
      <div class="preview">
        <img src="${img.dataUrl}" alt="preview ${idx + 1}" />
        <button type="button" data-remove-preview="${idx}">×</button>
      </div>
    `).join('');
    grid.querySelectorAll('[data-remove-preview]').forEach(btn => btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.removePreview);
      if (idx < existing.length) existing.splice(idx, 1); else newImages.splice(idx - existing.length, 1);
      draw();
    }));
  }

  fileInput.addEventListener('change', async () => {
    const files = Array.from(fileInput.files || []);
    for (const file of files){
      const dataUrl = await fileToDataURL(file);
      newImages.push({ id: uuid(), name:file.name, type:file.type, dataUrl });
    }
    fileInput.value = '';
    draw();
  });

  draw();
  modalContext.imageState = { get images(){ return [...existing, ...newImages]; } };
}

async function exportJson(obj, filename){
  const json = JSON.stringify(obj, null, 2);
  if ('showSaveFilePicker' in window){
    try{
      const handle = await window.showSaveFilePicker({ suggestedName: filename, types:[{ description:'JSON file', accept:{ 'application/json':['.json'] } }] });
      const writable = await handle.createWritable();
      await writable.write(json); await writable.close();
      showToast('Saved to selected location');
      return;
    }catch(err){ if (err?.name === 'AbortError') return; }
  }
  const blob = new Blob([json], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
  showToast('Download started');
}

function safeFileName(name){ return String(name || 'list').replace(/[\\/:*?"<>|]+/g, '-').trim().replace(/\s+/g, '_') || 'list'; }
async function importJsonFile(file){
  const data = JSON.parse(await file.text());
  if (Array.isArray(data.lists)){
    state.lists = data.lists;
    state.profiles = Array.isArray(data.profiles) ? data.profiles : [];
    if (!state.profiles.length) state.profiles=[{id:uuid(),name:'Personal',pinned:true,listIds:state.lists.map(l=>l.id),createdAt:nowISO(),updatedAt:nowISO()}];
    state.selectedProfileId=state.profiles[0]?.id||null;
    state.selectedListId = state.profiles[0]?.listIds?.[0] || state.lists[0]?.id || null;
  }else if (data.list && data.list.id){
    const idx = state.lists.findIndex(l => l.id === data.list.id);
    if (idx >= 0) state.lists[idx] = data.list; else state.lists.unshift(data.list);
    const p=selectedProfile()||state.profiles[0]; if(p){p.listIds=p.listIds||[];if(!p.listIds.includes(data.list.id))p.listIds.unshift(data.list.id);}
    state.selectedListId = data.list.id;
  }else throw new Error('Unsupported file format');
  render(); showToast('Imported');
}

  e.preventDefault();
  const current = modalContext;
  const list = selectedList();

  if (current?.type === 'profile'){
    const name=document.getElementById('profileName')?.value.trim(); if(!name)return;
    const existing=current.profileId?state.profiles.find(p=>p.id===current.profileId):null;
    if(existing){existing.name=name;touch(existing);}
    else {const p={id:uuid(),name,pinned:false,listIds:[],createdAt:nowISO(),updatedAt:nowISO()};state.profiles.push(p);state.selectedProfileId=p.id;state.selectedListId=null;}

  }

    const name = document.getElementById('listName')?.value.trim();
    const description = document.getElementById('listDescriptionEdit')?.value.trim() || '';
    if (!name) return;

    closeModal();

  }

  if (!list){ showToast('Create a list first'); return; }

  if (current?.type === 'entry'){
    const title = getFormValue('entryTitle').trim();

    const entry = list.entries.find(e => e.id === current.entryId);
    if (entry) updateEntry(entry, title, summary); else createEntry(list, title, summary);
    closeModal();
    return;
  }

  if (current?.type === 'sub'){
    const entry = list.entries.find(e => e.id === current.entryId);
    if (!entry) return;
    const text = getFormValue('subText').trim();
    if (!text) return;
    const pinned = document.getElementById('subPinned')?.checked || false;
    const images = current.imageState?.images || [];
    const sub = entry.subEntries.find(s => s.id === current.subId);
    if (sub) updateSubEntry(sub, text, images, pinned); else createSubEntry(entry, text, images, pinned);
    closeModal();
    return;
  }
});

function boot(){
  const saved = loadState();
  if (saved && Array.isArray(saved.lists)){
    state.lists = saved.lists || [];
    state.selectedListId = saved.selectedListId || state.lists[0]?.id || null;
    state.profiles = Array.isArray(saved.profiles) ? saved.profiles : [];
    state.selectedProfileId = saved.selectedProfileId || state.profiles[0]?.id || null;
    state.search = saved.search || '';
    els.searchBox.value = state.search;
  } else {
    const starter = { id:uuid(), name:'Today', createdAt:nowISO(), updatedAt:nowISO(), entries:[] };
    state.lists = [starter];
    state.selectedListId = starter.id;
    saveState();
  }
  const savedTheme=localStorage.getItem('ddrt_theme'); if(savedTheme)setTheme(savedTheme);
  render();
}
window.addEventListener('beforeunload', () => {
  state.search = els.searchBox.value;
  saveState();
});
boot();
</script>
</body>
</html>
